name: Demo media

on:
  push:
    branches: [main]
    paths:
      - "docs/vhs/**"
      - "docs/shots/**"
      - "docs/pages/**"
      - "cmd/dzzzr/**"
      - "cmd/dzzzr-mock/**"
      - ".github/workflows/media.yml"
  pull_request:
    paths:
      - "docs/vhs/**"
      - "docs/shots/**"
      - "docs/pages/**"
      - "cmd/dzzzr/**"
      - "cmd/dzzzr-mock/**"
      - ".github/workflows/media.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  gifs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install VHS toolchain
        run: brew install vhs ttyd ffmpeg
      - name: Render GIFs
        run: ./docs/vhs/render.sh
      - name: Verify GIF output
        run: |
          for f in dzzzr-quickstart dzzzr-gameplay dzzzr-mock dzzzr-admin; do
            test -s "docs/gifs/${f}.gif"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gifs
          path: docs/gifs/*.gif
          retention-days: 14

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Render screenshots
        run: ./docs/shots/render.sh
      - name: Verify screenshot output
        run: |
          for f in overview overview-dark games agent-run approval session-files login; do
            test -s "docs/screenshots/${f}.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [gifs, screenshots]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: gifs
          path: _site/gifs
      - uses: actions/download-artifact@v5
        with:
          name: screenshots
          path: _site/screenshots
      - name: Assemble site
        run: cp docs/pages/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
