name: Build dzzzr.xcframework

on:
  push:
    branches: [main]
    paths:
      - 'dzzzr/**'
      - 'mobile/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the framework
        run: |
          ./mobile/bind-ios.sh /tmp/xcframework-out
          ls -R /tmp/xcframework-out/dzzzr.xcframework | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: dzzzr.xcframework
          path: /tmp/xcframework-out/dzzzr.xcframework
          retention-days: 30
